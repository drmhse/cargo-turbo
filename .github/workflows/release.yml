name: release

# Publishing is driven by a tag, so the version that reaches crates.io is always
# one that exists in the history under that name.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal

      - name: the tag and the manifest must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$tag" = "$manifest" || {
            echo "tag $tag does not match Cargo.toml $manifest"; exit 1; }

      - run: cargo +nightly test --release

      # Skipped when the version is already on the index, so re-tagging or
      # replaying a release is not an error. crates.io accepts a version once and
      # never again, and the first 0.1.0 was published by hand.
      - name: publish unless already there
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if cargo +nightly search cargo-turbo --limit 1 | grep -q "\"$version\""; then
            echo "cargo-turbo $version is already published, nothing to do"
          else
            cargo +nightly publish --token ${{ secrets.CRATES_IO_API_KEY }}
          fi
